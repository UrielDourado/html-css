<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Pode escrever como quiser, contanto que esteja entre os &lt;p&gt; e &lt;/p&gt;</p>
    <p>Se precisar quebrar o texto em alguim lugar especifico <br> como esse, vc pode usar a tag &lt;br&gt;.</p>
    <p>Vamos adicionar alguns simbulos espciais:
        &reg;
        &copy; <!-- Para colocar simbulos só coloar o nome entre (& ;)-->
        &trade; <!--Para adicionar comentario só colocar <! e -- -->
        &Delta;
    </p>
    <p>Vamos adicinar alguns emojis
       &#x1F4A9; 
       &#x1F480; <!--Para adicionar emoji, é só colocar o codigo da emojipidea de entre (&#x ;) --> 
    </p>
</html>
