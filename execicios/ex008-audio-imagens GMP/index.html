<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <h2>Tente abrir esse em varios dispositivos diferentres ou simplismente aumente o tamnaho do seu navegador.</h2>
    <picture>
        <source media="(max-width: 750px)" srcset="image/pequena.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="image/media.png" type="image/png">
        <img src="image/grande.png" alt="Foto grande" type="image/png">
    </picture>
    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5.</p>
    <audio preload="metadata" controls loop>
        <source src="midia/music.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
