<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: lightcoral;
            width: 300px;
            height: 300px;

            /* 
            border-width: 10px;
            border-style: solid;
            border-color: darkgreen;
            Nessa ordem formando shorthands
            */
            border: 10px solid darkgreen;

            /*
             padding-top: 10px;
            padding-right: 15px;
            padding-bottom: 10px;
            padding-left: 15px; 
            Nessa ordem formando shorthands
            */
            padding: 10px 15px 10px 15px;

            /* 
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 50px;
            margin-left: 10px; 
            Nessa ordem formando shorthands
            */
            margin: 10px auto 50px auto;

            /* 
            outline-width: 5px;
            outline-style: dashed;
            outline-color: violet;
            Nessa ordem formando shorthands
            */
            outline: 5px dashed violet;
        }

        a {
            border: 10px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos tbm são box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como
        tudo isso funciona.</p>


</body>

</html>
