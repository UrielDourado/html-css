<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brincando com células</title>
    <style>
        body{
            border: 1px solid black;
           margin: 10px; 
           height: 97vh;
        }
        div {
            margin: 0;
            background-color: #b4afaf;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        table {
            border-collapse: collapse;
            width: 400px;
            height: 100px;
            background-color: white;
        }
        th {
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div>
        <table>
            <tbody>
                <tr>
                    <th>1</th>
                    <th>2</th>
                    <th rowspan="2">3</th>
                    <th>4</th>
                </tr>
                <tr>
                    <th>5</th>
                    <th>6</th>
                    <th>7</th>
                </tr>
                <tr>
                    <th colspan="3">8</th>
                    <th>9</th>
                </tr>
                <tr>
                    <th rowspan="2">10</th>
                    <th colspan="2">11</th>
                    <th>12</th>
                </tr>
                <tr>
                    <th>13</th>
                    <th>14</th>
                    <th>15</th>
                </tr>
                <tr>
                    <th colspan="4"><a href="tabela004.html">Tabela 004</a></th>
                </tr>
        
            </tbody>
        </table>
    </div>
</body>
</html>
