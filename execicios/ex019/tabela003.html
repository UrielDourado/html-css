<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brincando com células</title>
    <style>
        body {
            border: 1px solid black;
            margin: 10px;
            height: 97vh;
        }

        div {
            margin: 0;
            background-color: #b4afaf;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            height: 100px;
            background-color: white;
        }

        td {
            border: 2px solid black;
            text-align: center;
        }
    </style>
</head>

<body>
    <div>
        <table>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>2</td>
                    <td rowspan="2">3</td>
                    <td>4</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>6</td>
                    <td>7</td>
                </tr>
                <tr>
                    <td colspan="3">8</td>
                    <td>9</td>
                </tr>
                <tr>
                    <td rowspan="2">10</td>
                    <td colspan="2">11</td>
                    <td>12</td>
                </tr>
                <tr>
                    <td>13</td>
                    <td>14</td>
                    <td>15</td>
                </tr>
                <tr>
                    <td colspan="4"><a href="tabela004.html">Tabela 004</a></td>
                </tr>

            </tbody>
        </table>
    </div>
</body>

</html>
