<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brincando com células</title>
    <style>
        body {
            border: 1px solid black;
            margin: 10px;
            height: 97vh;
        }

        div {
            margin: 0;
            background-color: #b4afaf;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            height: 100px;
            background-color: white;
        }

        td {
            border: 2px solid black;
            text-align: center;
        }
    </style>
</head>

<body>
    <div>
        <table>
            <tbody>
                <tr>
                    <td colspan="4">A</td>
                    <td rowspan="4">B</td>
                </tr>
                <tr>
                    <td rowspan="4">C</td>
                    <td>D</td>
                    <td>E</td>
                    <td>F</td>
                </tr>
                <tr>
                    <td>G</td>
                    <td>H</td>
                    <td>I</td>
                </tr>
                <tr>
                    <td>J</td>
                    <td>L</td>
                    <td>M</td>
                </tr>
                <tr>
                    <td colspan="4">N</td>
                </tr>
                <tr>
                    <td colspan="3"><a href="https://urieldourado.github.io/html-css/">Pag Inicial</a></td>
                    <td colspan="2" ><a href="tabela005.html"> Tabela de Notas</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
