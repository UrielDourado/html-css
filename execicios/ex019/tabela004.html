<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brincando com células</title>
    <style>
        body{
            border: 1px solid black;
           margin: 10px; 
           height: 97vh;
        }
        div {
            margin: 0;
            background-color: #b4afaf;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        table {
            border-collapse: collapse;
            width: 400px;
            height: 100px;
            background-color: white;
        }
        th {
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div>
        <table>
            <tbody>
                <tr>
                    <th colspan="4">A</th>
                    <th rowspan="4">B</th>
                </tr>
                <tr>
                    <th rowspan="4">C</th>
                    <th>D</th>
                    <th>E</th>
                    <th>F</th>
                </tr>
                <tr>
                    <th>G</th>
                    <th>H</th>
                    <th>I</th>
                </tr>
                <tr>
                    <th>J</th>
                    <th>L</th>
                    <th>M</th>
                </tr>
                <tr>
                    <th colspan="4">N</th>
                </tr>
                <tr>
                    <th colspan="5"><a href="https://urieldourado.github.io/html-css/">Pag Inicial</a></th>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
